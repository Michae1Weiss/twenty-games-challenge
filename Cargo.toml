[workspace]
resolver = "3"
members = ["game_01_breakout"]

[workspace.dependencies]
# See: https://bevy.org/news/bevy-0-18/#cargo-feature-collections
# bevy = { version = "0.18.1", default-features = false, features = ["2d"] }

bevy = { version = "0.18.1", default-features = false, features = [
    # === Core app infrastructure ===
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_state",
    "bevy_log",
    "bevy_asset",
    "reflect_auto_register",

    # === Platform (Linux/Sway) ===
    "bevy_winit",
    "wayland",                      # try this first on Sway; fall back to "x11" if issues

    # === Rendering core ===
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_color",
    "bevy_window",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",

    # === 2D rendering ===
    "bevy_sprite",
    "bevy_sprite_render",

    # === UI (Node + Text) ===
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "default_font",
] }

# bevy_asset_loader = "0.25.0"
# rand = "0.9.2"
# rand_chacha = "0.9.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "fat"
# See: https://github.com/bevyengine/bevy/discussions/2476#discussioncomment-10975792
strip = "symbols"
panic = "abort"
opt-level = "z"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "z"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"

